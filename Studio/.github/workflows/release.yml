name: Build signed distribution release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      FLOW_API_KEY: ${{ secrets.FLOW_API_KEY }}
      RELEASE_SIGNING_KEY_PEM: ${{ secrets.RELEASE_SIGNING_KEY_PEM }}
      DISTRIBUTION_REPO_TOKEN: ${{ secrets.DISTRIBUTION_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"

      - name: Validate release tag and secrets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag phải có dạng vX.Y.Z."
          }
          $sourceVersion = python -c "from docurandom import __version__; print(__version__)"
          if ($sourceVersion -ne $version) {
            throw "Tag $version không khớp source $sourceVersion."
          }
          if (-not $env:FLOW_API_KEY -or -not $env:RELEASE_SIGNING_KEY_PEM -or -not $env:DISTRIBUTION_REPO_TOKEN) {
            throw "Thiếu secret phát hành bắt buộc."
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies and run Python tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          python -m pytest tests -q

      - name: Build ChatGPT Web Bridge from pinned source
        shell: pwsh
        run: |
          npm install --global pnpm@11.19.0
          Push-Location chat_bridge
          try {
            pnpm install --frozen-lockfile
            pnpm run package
          } finally {
            Pop-Location
          }
          $bridgeRoot = Join-Path $PWD "third_party\docurandom-chat-bridge"
          New-Item -ItemType Directory -Path (Split-Path -Parent $bridgeRoot) -Force | Out-Null
          Copy-Item -LiteralPath "chat_bridge\dist\win-unpacked" -Destination $bridgeRoot -Recurse
          python tools\pin_bridge_hashes.py `
            $bridgeRoot `
            --expected-version (python -c "from docurandom.content_ai import CHATGPT_WEB_BRIDGE_VERSION; print(CHATGPT_WEB_BRIDGE_VERSION)")

      - name: Stage verified official Codex CLI for clean machines
        shell: pwsh
        run: |
          $version = "0.149.0"
          $expected = "1363f73fbfa6734f87185f06effffcbcca057f8206b1176e531a6be7f7fa12ba"
          $asset = "codex-x86_64-pc-windows-msvc.exe.zip"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $extract = Join-Path $env:RUNNER_TEMP "docurandom-codex-$version"
          Invoke-WebRequest `
            -Headers @{"User-Agent"="DocuRandomStudio-release"} `
            -Uri "https://github.com/openai/codex/releases/download/rust-v$version/$asset" `
            -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Codex CLI không khớp SHA-256 đã khóa."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $source = Get-ChildItem -LiteralPath $extract -Filter "codex-*-windows-msvc.exe" -File
          if ($source.Count -ne 1) {
            throw "Không xác định được codex.exe trong gói chính thức."
          }
          $destination = Join-Path $PWD "third_party\docurandom-codex"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item -LiteralPath $source.FullName -Destination (Join-Path $destination "codex.exe")

      - name: Prepare pinned watermark runtime source
        id: watermark
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP "watermark-package"
          $extractRoot = Join-Path $env:RUNNER_TEMP "watermark-source"
          New-Item -ItemType Directory -Path $packageRoot,$extractRoot -Force | Out-Null
          $archiveName = npm pack @pilio/gemini-watermark-remover@1.0.39 --pack-destination $packageRoot --silent
          if ($LASTEXITCODE -ne 0) { throw "Không thể tải watermark runtime đã khóa." }
          tar -xf (Join-Path $packageRoot $archiveName.Trim()) -C $extractRoot
          $watermarkRoot = Join-Path $extractRoot "package"
          if (-not (Test-Path -LiteralPath (Join-Path $watermarkRoot "bin\gwr.mjs"))) {
            throw "Gói watermark thiếu CLI."
          }
          "WATERMARK_ROOT=$watermarkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Inject build-only Flow configuration
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "flow-extension\config.example.js" -Destination "flow-extension\config.js"
          python -c "import os,pathlib; pathlib.Path('flow_engine/local_config.py').write_text('FLOW_API_KEY = ' + repr(os.environ['FLOW_API_KEY']) + '\n', encoding='utf-8')"

      - name: Build portable application
        shell: pwsh
        run: |
          .\build_release.ps1 -Python python -WatermarkRoot $env:WATERMARK_ROOT

      - name: Build one-file direct-run Windows launcher
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          .\build_installer.ps1 `
            -Version $env:RELEASE_VERSION `
            -PortableDir "release\DocuRandomStudio" `
            -OutputDir "release"

      - name: Sign update manifest with protected secret
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "docurandom-release-signing.pem"
          [IO.File]::WriteAllText($keyPath, $env:RELEASE_SIGNING_KEY_PEM, [Text.Encoding]::ASCII)
          $artifactRoot = Join-Path $PWD "artifacts\release-$env:RELEASE_VERSION"
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          $portable = Join-Path $artifactRoot "DocuRandomStudio-portable.zip"
          Copy-Item -LiteralPath "release\DocuRandomStudio-portable.zip" -Destination $portable
          python tools\sign_update.py `
            --version $env:RELEASE_VERSION `
            --asset $portable `
            --private-key $keyPath `
            --manifest (Join-Path $artifactRoot "update-manifest.json") `
            --signature (Join-Path $artifactRoot "update-manifest.sig")

      - name: Publish immutable version assets
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_REPO_TOKEN }}
        shell: pwsh
        run: |
          $tag = "docurandom-v$env:RELEASE_VERSION"
          $artifactRoot = Join-Path $PWD "artifacts\release-$env:RELEASE_VERSION"
          $distributionRepo = "JustHari01/DocuRandom-DN"
          $releaseNotes = Join-Path $env:RUNNER_TEMP "docurandom-release-notes.md"
          $notesBlocks = (Get-Content -Raw -LiteralPath "RELEASE_NOTES_VI.md") -split "(?:\r?\n){2,}"
          $currentNotes = $notesBlocks[0].Trim()
          if (-not $currentNotes.Contains("``$env:RELEASE_VERSION``")) {
            throw "Khối ghi chú đầu tiên không thuộc phiên bản $env:RELEASE_VERSION."
          }
          [IO.File]::WriteAllText(
            $releaseNotes,
            $currentNotes + [Environment]::NewLine,
            [Text.UTF8Encoding]::new($false)
          )
          if (gh release view $tag --repo $distributionRepo 2>$null) {
            throw "Release $tag đã tồn tại; từ chối ghi đè asset đã phát hành."
          }
          gh release create $tag `
            (Join-Path $artifactRoot "DocuRandomStudio-portable.zip") `
            (Join-Path $artifactRoot "update-manifest.json") `
            (Join-Path $artifactRoot "update-manifest.sig") `
            "release\DocuRandomStudio.exe" `
            --repo $distributionRepo `
            --target main `
            --title "DocuRandom Studio $env:RELEASE_VERSION" `
            --notes-file $releaseNotes

      - name: Remove release key from runner
        if: always()
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "docurandom-release-signing.pem"
          if (Test-Path -LiteralPath $keyPath) {
            Remove-Item -LiteralPath $keyPath -Force
          }
