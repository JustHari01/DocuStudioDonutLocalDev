<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DocuRandom Donut Bridge</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; }
      html { min-height: 100%; background: #0b0b0c; }
      body { box-sizing: border-box; width: min(440px, calc(100% - 32px)); margin: 40px auto; padding: 20px; background: #0b0b0c; color: #f5f5f5; }
      h1 { margin: 0 0 6px; font-size: 16px; }
      p { margin: 0 0 14px; color: #a5a5a8; font-size: 12px; line-height: 1.45; }
      .status { margin-bottom: 12px; padding: 10px; border: 1px solid #303034; background: #141416; }
      .dot { display: inline-block; width: 8px; height: 8px; margin-right: 7px; border-radius: 50%; background: #e0a83e; }
      .dot.ok { background: #55c878; }
      .profile { margin-top: 6px; overflow-wrap: anywhere; color: #bdbdc2; font-size: 11px; }
      button { box-sizing: border-box; width: 100%; height: 36px; margin-top: 8px; border: 1px solid #f5f5f5; background: #f5f5f5; color: #0b0b0c; font-weight: 700; cursor: pointer; }
      button.secondary { border-color: #3c3c42; background: transparent; color: #e9e9ea; }
      button:disabled { cursor: wait; opacity: .55; }
      #repairPanel { margin-top: 14px; padding-top: 12px; border-top: 1px solid #303034; }
      #repairPanel[hidden] { display: none; }
      #repairSecret { box-sizing: border-box; width: 100%; height: 32px; padding: 6px 8px; border: 1px solid #3c3c42; background: #141416; color: #f5f5f5; }
      #message { min-height: 18px; margin-top: 10px; color: #e0a83e; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>DocuRandom Donut Bridge</h1>
    <p>Mở chế độ ghép đúng profile trong DocuRandom, sau đó bấm nút dưới đây một lần.</p>
    <div class="status">
      <div><span id="dot" class="dot"></span><span id="statusText">Đang kiểm tra…</span></div>
      <div id="profile" class="profile"></div>
    </div>
    <button id="pairButton">Ghép profile này</button>
    <button id="forgetButton" class="secondary">Quên liên kết</button>
    <div id="repairPanel" hidden>
      <input id="repairSecret" type="password" autocomplete="off" placeholder="Khóa liên kết cũ" />
      <button id="repairButton" class="secondary">Khôi phục liên kết cũ</button>
    </div>
    <div id="message"></div>
    <script src="popup.js"></script>
  </body>
</html>
